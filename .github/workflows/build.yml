name: Build Release

on:
  push:
    branches:
      - master
      - dev

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: minify
            minified: true
            archive: afetch-minify.tar.gz
            tag: release-minify
            release_name: "Release Minify"

          - name: normal
            minified: false
            archive: afetch.tar.gz
            tag: release
            release_name: "Release"

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Configure Android Tools
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"

          D8_PATH=$(find "$SDK_ROOT/build-tools" -name d8 | sort -V | tail -n 1)
          AIDL_PATH=$(find "$SDK_ROOT/build-tools" -name aidl | sort -V | tail -n 1)
          R8_PATH=$(find "$SDK_ROOT" -name r8.jar | head -n 1)

          [ -n "$D8_PATH" ]   || { echo "d8 not found"; exit 1; }
          [ -n "$AIDL_PATH" ] || { echo "aidl not found"; exit 1; }

          sed -i "s|^D8=.*|D8=$D8_PATH|" config.sh
          sed -i "s|^AIDL=.*|AIDL=$AIDL_PATH|" config.sh
          sed -i "s|^MINIFIED=.*|MINIFIED=${{ matrix.minified }}|" config.sh

          if [ "${{ matrix.minified }}" = "true" ]; then
            [ -n "$R8_PATH" ] || { echo "r8.jar not found"; exit 1; }
            sed -i "s|^R8=.*|R8=java -jar $R8_PATH|" config.sh
          fi

      - name: Build
        run: |
          chmod +x build.sh install.sh
          ./build.sh

      - name: Package
        run: |
          DIR_NAME="${{ matrix.archive }}"
          DIR_NAME="${DIR_NAME%.tar.gz}"

          touch $DIR_NAME
          tar \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./build' \
            --exclude='./lib' \
            --transform "s,^\./,${DIR_NAME}/," \
            -czvf "${{ matrix.archive }}" .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.tag }}
          name: ${{ matrix.release_name }}
          body: |
            finally release 1.0.2

          files: |
            ${{ matrix.archive }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
