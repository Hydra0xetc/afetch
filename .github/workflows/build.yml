name: Build Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-normal:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Configure Android Tools
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"

          D8_PATH=$(find "$SDK_ROOT/build-tools" -name d8 | sort -V | tail -n 1)
          AIDL_PATH=$(find "$SDK_ROOT/build-tools" -name aidl | sort -V | tail -n 1)

          [ -n "$D8_PATH" ]   || { echo "d8 not found"; exit 1; }
          [ -n "$AIDL_PATH" ] || { echo "aidl not found"; exit 1; }

          sed -i "s|^D8=.*|D8=$D8_PATH|" config.sh
          sed -i "s|^AIDL=.*|AIDL=$AIDL_PATH|" config.sh
          sed -i "s|^MINIFIED=.*|MINIFIED=false|" config.sh

      - name: Build non minify
        run: |
          chmod +x build.sh install.sh
          ./build.sh

      - name: Package non minify
        run: |
          ARCHIVE=afetch.tar.gz
          DIR_NAME="${ARCHIVE%.tar.gz}"
          touch $ARCHIVE

          tar \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./build' \
            --exclude='./lib' \
            --transform "s,^\./,${DIR_NAME}/," \
            -czvf "$ARCHIVE" .

      - uses: actions/upload-artifact@v4
        with:
          name: afetch
          path: afetch.tar.gz


  build-minify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Configure Android Tools
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"

          D8_PATH=$(find "$SDK_ROOT/build-tools" -name d8 | sort -V | tail -n 1)
          AIDL_PATH=$(find "$SDK_ROOT/build-tools" -name aidl | sort -V | tail -n 1)

          [ -n "$D8_PATH" ]   || { echo "d8 not found"; exit 1; }
          [ -n "$AIDL_PATH" ] || { echo "aidl not found"; exit 1; }

          curl -L \
            https://storage.googleapis.com/r8-releases/raw/8.4.46/r8lib.jar \
            -o r8.jar

          cat > r8 << 'EOF'
          #!/usr/bin/env bash

          HERE="$(dirname "$(realpath "${BASH_SOURCE[0]}")")"

          exec java \
            -cp "$HERE/r8.jar" \
            com.android.tools.r8.R8 \
            "$@"
          EOF

          chmod +x r8

          sed -i "s|^D8=.*|D8=$D8_PATH|" config.sh
          sed -i "s|^AIDL=.*|AIDL=$AIDL_PATH|" config.sh
          sed -i "s|^MINIFIED=.*|MINIFIED=true|" config.sh
          sed -i "s|^R8=.*|R8=$(pwd)/r8|" config.sh

      - name: Build minify
        run: |
          chmod +x build.sh install.sh
          ./build.sh

      - name: Package minify
        run: |
          ARCHIVE=afetch-minify.tar.gz
          DIR_NAME="${ARCHIVE%.tar.gz}"

          touch $ARCHIVE
          tar \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./build' \
            --exclude='./lib' \
            --transform "s,^\./,${DIR_NAME}/," \
            -czvf "$ARCHIVE" .

      - uses: actions/upload-artifact@v4
        with:
          name: afetch-minify
          path: afetch-minify.tar.gz


  release:
    needs:
      - build-normal
      - build-minify

    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: afetch

      - uses: actions/download-artifact@v4
        with:
          name: afetch-minify

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-1.0.2
          name: Release 1.0.2
          body: |
            finally release 1.0.2

          files: |
            afetch.tar.gz
            afetch-minify.tar.gz

          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
